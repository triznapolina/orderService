databaseChangeLog:
  - changeSet:
      id: create-table-items
      author: polina_tr

      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: items

      changes:
        - createTable:
            tableName: items
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(70)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: decimal
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: lastUpdated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_items_price
            tableName: items
            columns:
              - column:
                  name: price
        - createIndex:
            indexName: idx_items_name
            tableName: items
            columns:
              - column:
                  name: name